<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel v3 - DATZON</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"

    <style>
      /* ============================================
      CSS (Tema Gelap + CSS untuk CRUD)
      ============================================
    */
      :root {
        --bg-color: #1a1a1a;
        --form-bg: #2a2a2a;
        --text-color: #f0f0f0;
        --label-color: #aaa;
        --primary-color: #007bff;
        --border-color: #444;
        --success-color: #28a745;
        --error-color: #dc3545;
        --warning-color: #ffc107;
        --secondary-bg: #333;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Work Sans", sans-serif;
        background: var(--bg-color);
        color: var(--text-color);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      /* === Navigasi Tab === */
      .tab-navigation {
        display: flex;
        margin-bottom: -1px;
        z-index: 10;
      }
      .tab-btn {
        padding: 12px 20px;
        border: 1px solid var(--border-color);
        background: var(--secondary-bg);
        color: var(--label-color);
        cursor: pointer;
        font-size: 15px;
        font-weight: 600;
        border-bottom: none;
        border-radius: 8px 8px 0 0;
        transition: background 0.2s, color 0.2s;
      }
      .tab-btn:hover {
        background: #444;
      }
      .tab-btn.active {
        background: var(--form-bg);
        color: var(--text-color);
        border-bottom: 1px solid var(--form-bg);
      }

      /* === Kontainer Admin === */
      .admin-container {
        width: 100%;
        max-width: 800px; /* Lebih lebar untuk CRUD list */
        background: var(--form-bg);
        border-radius: 12px;
        border-top-left-radius: 0;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }

      .tab-content {
        display: none;
      }
      .tab-content.active {
        display: block;
        animation: fadeIn 0.5s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      h1,
      h2 {
        text-align: left;
        margin-bottom: 25px;
        font-weight: 700;
        padding-bottom: 15px;
        border-bottom: 1px solid var(--border-color);
      }
      h2 {
        font-size: 20px;
        margin-top: 30px;
      }

      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 500;
        color: var(--label-color);
      }

      /* Input universal */
      input[type="text"],
      input[type="number"],
      input[type="file"],
      select,
      textarea {
        width: 100%;
        padding: 12px 15px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        background: var(--secondary-bg);
        color: var(--text-color);
        font-size: 15px;
        transition: border-color 0.2s, box-shadow 0.2s;
        font-family: "Work Sans", sans-serif;
      }
      input[readonly] {
        background: #444;
      }

      textarea {
        min-height: 100px;
        resize: vertical;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.3);
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .checkbox-group input {
        width: 18px;
        height: 18px;
      }

      /* === Styling Form Dinamis (Price, FAQ) === */
      .dynamic-list-container {
        padding: 15px;
        background: var(--bg-color);
        border-radius: 8px;
        margin-top: 10px;
      }
      .dynamic-item {
        padding: 15px;
        background: var(--secondary-bg);
        border-radius: 6px;
        margin-bottom: 10px;
        border-left: 3px solid var(--primary-color);
        position: relative;
      }
      .dynamic-item-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .dynamic-item .col-full {
        grid-column: 1 / -1;
      }

      .remove-item-btn {
        position: absolute;
        top: 5px;
        right: 5px;
        background: var(--error-color);
        color: white;
        border: none;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        cursor: pointer;
        font-weight: bold;
        z-index: 2;
      }
      .add-item-btn {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 6px;
        background: var(--primary-color);
        color: white;
        font-weight: 600;
        cursor: pointer;
        opacity: 0.8;
        transition: opacity 0.2s;
      }
      .add-item-btn:hover {
        opacity: 1;
      }
      .row-buttons {
        display: flex;
        gap: 10px;
      }

      /* Tombol Submit */
      .submit-btn {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 8px;
        background: var(--success-color);
        color: white;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
        margin-top: 10px;
      }
      .submit-btn:hover {
        background: #218838;
      }
      .submit-btn:disabled {
        background: #555;
        cursor: not-allowed;
      }

      /* === BARU: CSS untuk Kelola Data (Read/Update/Delete) === */
      #data-display-container {
        margin-top: 20px;
        max-height: 500px;
        overflow-y: auto;
        background: var(--bg-color);
        padding: 10px;
        border-radius: 8px;
      }
      .data-item-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--secondary-bg);
        padding: 12px 15px;
        border-radius: 8px;
        margin-bottom: 10px;
      }
      .data-item-info {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .data-item-info img {
        width: 40px;
        height: 40px;
        border-radius: 6px;
        object-fit: cover;
      }
      .data-item-info strong {
        font-size: 16px;
      }
      .data-item-info span {
        font-size: 12px;
        color: var(--label-color);
      }
      .data-item-actions button {
        border: none;
        border-radius: 6px;
        padding: 8px 12px;
        cursor: pointer;
        font-weight: 600;
        margin-left: 10px;
        transition: all 0.2s;
      }
      .edit-btn {
        background: var(--warning-color);
        color: #111;
      }
      .delete-btn {
        background: var(--error-color);
        color: white;
      }
      .edit-btn:hover {
        background: #e0a800;
      }
      .delete-btn:hover {
        background: #c82333;
      }

      /* === BARU: CSS untuk Modal (Edit & Delete) === */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(5px);
        z-index: 1000;
        display: none;
        align-items: center;
        justify-content: center;
      }
      .modal-overlay.show {
        display: flex;
      }

      .modal-box {
        background: var(--form-bg);
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        z-index: 1001;
      }

      /* Modal Hapus */
      #delete-modal {
        width: 90%;
        max-width: 400px;
        text-align: center;
      }
      #delete-modal h3 {
        font-size: 20px;
        margin-bottom: 10px;
      }
      #delete-modal p {
        margin-bottom: 25px;
        color: var(--label-color);
      }
      #delete-modal p strong {
        color: var(--text-color);
      }
      #delete-confirm-btn {
        background: var(--error-color);
      }

      /* Modal Edit */
      #edit-modal {
        width: 90%;
        max-width: 700px;
        max-height: 90vh;
        overflow-y: auto;
      }
      #edit-modal h1 {
        font-size: 24px;
      }
      #edit-modal-content {
        /* Form di dalam modal akan ditempatkan di sini */
      }

      /* Status & Loader */
      .loader {
        width: 24px;
        height: 24px;
        border: 3px solid #fff;
        border-bottom-color: transparent;
        border-radius: 50%;
        display: inline-block;
        animation: rotation 1s linear infinite;
        margin-left: 10px;
      }
      @keyframes rotation {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .status-message {
        text-align: center;
        margin-top: 15px;
        font-size: 15px;
        font-weight: 500;
      }
      .status-message.success {
        color: var(--success-color);
      }
      .status-message.error {
        color: var(--error-color);
      }
    </style>
  </head>

    <!--

    SKRIP LOGIKA UTAMA (Full CRUD)
    ======================================================
  -->
    <script>
      // ----------------------------------------------------
      // Info Cloudinary (Anda sudah isi)
      // ----------------------------------------------------
      const CLOUDINARY_CLOUD_NAME = "dvhwd2rci";
      const CLOUDINARY_UPLOAD_PRESET = "datzon-unsigned";
      // ----------------------------------------------------

      // --- Template HTML ---
      const storeFormTemplate = document.getElementById(
        "store-form-template"
      ).innerHTML;

      // --- Elemen Global ---
      const deleteModal = document.getElementById("delete-modal");
      const editModal = document.getElementById("edit-modal");

      document.addEventListener("DOMContentLoaded", () => {
        // --- 1. LOGIKA NAVIGASI TAB ---
        const tabButtons = document.querySelectorAll(".tab-btn");
        const tabContents = document.querySelectorAll(".tab-content");
        tabButtons.forEach((button) => {
          button.addEventListener("click", () => {
            tabButtons.forEach((btn) => btn.classList.remove("active"));
            tabContents.forEach((content) =>
              content.classList.remove("active")
            );
            button.classList.add("active");
            const tabId = button.dataset.tab;
            document
              .getElementById(`${tabId}-form-container`)
              .classList.add("active");
          });
        });

        // --- 2. LOGIKA TAB 1: CREATE MOD APP ---
        setupCreateModForm();

        // --- 3. LOGIKA TAB 2: CREATE STORE PRODUCT ---
        setupCreateStoreForm();

        // --- 4. LOGIKA TAB 3: KELOLA DATA (R/U/D) ---
        setupManageDataTab();
      }); // Akhir DOMContentLoaded

      /*
    ================================================
    FUNGSI SETUP FORM (CREATE)
    ================================================
    */

      function setupCreateModForm() {
        const modForm = document.getElementById("mod-app-form");
        const modSubmitBtn = document.getElementById("mod-submit-btn");
        const modLoader = document.getElementById("mod-loader");
        const modStatus = document.getElementById("status-message-mod");

        modForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          setLoading(modSubmitBtn, modLoader, true, "Mengupload...");
          setStatus(modStatus, "", "");

          try {
            const imageFile = document.getElementById("mod-imageFile").files[0];
            let imageUrl = null;
            if (imageFile) {
              imageUrl = await uploadToCloudinary(imageFile);
            }

            const appData = {
              name: document.getElementById("mod-name").value,
              date: document.getElementById("mod-date").value,
              downloadLink: document.getElementById("mod-downloadLink").value,
              category: document.getElementById("mod-category").value,
              isPopular: document.getElementById("mod-isPopular").checked,
            };

            if (imageUrl) {
              appData.imageUrl = imageUrl;
            }

            await db.collection("modApps").add(appData);
            setStatus(modStatus, "success", "Aplikasi MOD berhasil disimpan!");
            modForm.reset();
          } catch (error) {
            console.error("Error Simpan MOD:", error);
            setStatus(modStatus, "error", `Error: ${error.message}`);
          } finally {
            setLoading(
              modSubmitBtn,
              modLoader,
              false,
              "Simpan ke Database MOD"
            );
          }
        });
      }

      function setupCreateStoreForm() {
        const formContainer = document.getElementById("store-form-content");
        formContainer.innerHTML = storeFormTemplate; // Render form dari template

        const storeForm = document.getElementById("store-product-form");
        const storeSubmitBtn = document.getElementById("store-submit-btn");
        const storeLoader = document.getElementById("store-loader");
        const storeStatus = document.getElementById("status-message-store");

        // Tambahkan listener ke tombol dinamis di dalam form
        addDynamicFormListeners(formContainer);

        storeForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          setLoading(storeSubmitBtn, storeLoader, true, "Mengupload...");
          setStatus(storeStatus, "", "");

          const formContent = e.target.querySelector("#store-form-content");

          try {
            // Panggil fungsi reusable untuk mengambil data & save
            await saveStoreProduct(formContent);

            setStatus(storeStatus, "success", "Produk Toko berhasil disimpan!");
            storeForm.reset();
            formContainer.innerHTML = storeFormTemplate; // Reset form ke template awal
            addDynamicFormListeners(formContainer); // Pasang ulang listener
          } catch (error) {
            console.error("Error Simpan Store:", error);
            setStatus(storeStatus, "error", `Error: ${error.message}`);
          } finally {
            setLoading(
              storeSubmitBtn,
              storeLoader,
              false,
              "Simpan ke Database Store"
            );
          }
        });
      }

      /*
    ================================================
    FUNGSI TAB 3: KELOLA DATA (READ, UPDATE, DELETE)
    ================================================
    */

      function setupManageDataTab() {
        const loadModBtn = document.getElementById("load-mod-data-btn");
        const loadStoreBtn = document.getElementById("load-store-data-btn");
        const displayContainer = document.getElementById(
          "data-display-container"
        );
        const displayLoader = document.getElementById("data-display-loader");

        // --- READ ---
        loadModBtn.addEventListener("click", () => loadData("modApps"));
        loadStoreBtn.addEventListener("click", () => loadData("storeProducts"));

        async function loadData(collectionName) {
          displayLoader.style.display = "block";
          displayContainer.innerHTML = "";
          try {
            const snapshot = await db.collection(collectionName).get();
            if (snapshot.empty) {
              displayContainer.innerHTML =
                "<p>Tidak ada data di koleksi ini.</p>";
              return;
            }

            snapshot.forEach((doc) => {
              const data = doc.data();
              const card = document.createElement("div");
              card.className = "data-item-card";
              card.innerHTML = `
              <div class="data-item-info">
                <img src="${
                  data.imageUrl || "https://placehold.co/40x40/555/eee?text=?"
                }" alt="img">
                <div>
                  <strong>${data.name}</strong><br>
                  <span>ID: ${doc.id}</span>
                </div>
              </div>
              <div class="data-item-actions">
                <button class="edit-btn" data-id="${
                  doc.id
                }" data-collection="${collectionName}">
                  <i class="fas fa-edit"></i> Edit
                </button>
                <button class="delete-btn" data-id="${
                  doc.id
                }" data-collection="${collectionName}" data-name="${data.name}">
                  <i class="fas fa-trash"></i> Delete
                </button>
              </div>
            `;
              displayContainer.appendChild(card);
            });
          } catch (error) {
            displayContainer.innerHTML = `<p class="status-message error">Error: ${error.message}</p>`;
          } finally {
            displayLoader.style.display = "none";
          }
        }

        // --- DELETE & UPDATE (Event Delegation) ---
        displayContainer.addEventListener("click", (e) => {
          const deleteBtn = e.target.closest(".delete-btn");
          const editBtn = e.target.closest(".edit-btn");

          if (deleteBtn) {
            const docId = deleteBtn.dataset.id;
            const collection = deleteBtn.dataset.collection;
            const name = deleteBtn.dataset.name;
            openDeleteModal(collection, docId, name);
          }

          if (editBtn) {
            const docId = editBtn.dataset.id;
            const collection = editBtn.dataset.collection;
            openEditModal(collection, docId);
          }
        });

        // --- DELETE MODAL ---
        let deleteInfo = {}; // Untuk menyimpan info apa yang akan dihapus
        const deleteConfirmBtn = document.getElementById("delete-confirm-btn");
        const deleteCancelBtn = document.getElementById("delete-cancel-btn");

        function openDeleteModal(collection, docId, name) {
          deleteInfo = { collection, docId };
          document.getElementById("delete-item-name").textContent = name;
          deleteModal.classList.add("show");
        }

        deleteCancelBtn.addEventListener("click", () =>
          deleteModal.classList.remove("show")
        );
        deleteModal.addEventListener("click", (e) => {
          if (e.target === deleteModal) deleteModal.classList.remove("show");
        });

        deleteConfirmBtn.addEventListener("click", async () => {
          const { collection, docId } = deleteInfo;
          try {
            // TODO: Hapus sub-koleksi jika 'storeProducts'
            if (collection === "storeProducts") {
              // Ini adalah operasi kompleks, untuk saat ini kita hapus dokumen utamanya saja
              // Menghapus sub-koleksi dari sisi klien itu sulit dan tidak disarankan
              console.warn(
                `Menghapus ${docId}, tapi sub-koleksi 'faqs' mungkin akan tertinggal (orphaned).`
              );
            }

            await db.collection(collection).doc(docId).delete();
            deleteModal.classList.remove("show");
            loadData(collection); // Muat ulang data
          } catch (error) {
            console.error("Error Hapus:", error);
            document
              .getElementById("delete-modal")
              .querySelector("p").textContent = `Error: ${error.message}`;
          }
        });

        // --- EDIT MODAL ---
        const editModalContent = document.getElementById("edit-modal-content");
        const editCloseBtn = document.getElementById("edit-close-btn");

        editCloseBtn.addEventListener("click", () =>
          editModal.classList.remove("show")
        );
        editModal.addEventListener("click", (e) => {
          if (e.target === editModal) editModal.classList.remove("show");
        });

        async function openEditModal(collection, docId) {
          editModal.classList.add("show");
          editModalContent.innerHTML = `<div class="loader" style="margin: 40px auto;"></div>`;
          const editStatus = document.getElementById("edit-status-message");
          setStatus(editStatus, "", "");

          try {
            if (collection === "storeProducts") {
              // 1. Ambil data utama & faqs
              const docRef = db.collection(collection).doc(docId);
              const doc = await docRef.get();
              const data = doc.data();
              const faqsSnapshot = await docRef
                .collection("faqs")
                .orderBy("order")
                .get();

              // 2. Render form dari template
              editModalContent.innerHTML = storeFormTemplate;
              addDynamicFormListeners(editModalContent); // Pasang listener

              // 3. Isi form dengan data
              const idInput =
                editModalContent.querySelector(".store-productID");
              idInput.value = docId;
              idInput.readOnly = true; // Kunci ID, tidak boleh diubah

              editModalContent.querySelector(".store-name").value =
                data.name || "";
              editModalContent.querySelector(".store-description").value =
                data.description || "";
              editModalContent.querySelector(".store-notes").value =
                data.notes || "";

              if (data.imageUrl) {
                const preview =
                  editModalContent.querySelector(".image-preview");
                preview.src = data.imageUrl;
                preview.style.display = "block";
              }

              // 4. Isi priceBundles dinamis
              const priceContainer = editModalContent.querySelector(
                ".price-bundles-container"
              );
              data.priceBundles.forEach((bundle) => {
                const item = createPriceBundleElement(bundle);
                priceContainer.appendChild(item);
              });

              // 5. Isi FAQs dinamis
              const faqContainer =
                editModalContent.querySelector(".faqs-container");
              faqsSnapshot.forEach((faqDoc) => {
                const item = createFaqElement(faqDoc.data());
                faqContainer.appendChild(item);
              });

              // 6. Buat tombol Save
              const saveBtn = document.createElement("button");
              saveBtn.type = "button";
              saveBtn.id = "edit-save-btn";
              saveBtn.className = "submit-btn";
              saveBtn.textContent = "Simpan Perubahan";

              saveBtn.addEventListener("click", async () => {
                setLoading(saveBtn, null, true, "Menyimpan...");
                try {
                  await saveStoreProduct(editModalContent, docId); // Panggil fungsi save dengan docId
                  setStatus(editStatus, "success", "Berhasil diperbarui!");
                  setTimeout(() => {
                    editModal.classList.remove("show");
                    loadData(collection); // Muat ulang data di Tab 3
                  }, 1500);
                } catch (error) {
                  setStatus(
                    editStatus,
                    "error",
                    `Error Update: ${error.message}`
                  );
                } finally {
                  setLoading(saveBtn, null, false, "Simpan Perubahan");
                }
              });
              editModalContent.appendChild(saveBtn);
            } else if (collection === "modApps") {
              // TODO: Buat logic edit untuk modApps (lebih simpel)
              editModalContent.innerHTML =
                "<p>Fitur edit untuk MODs belum dibuat.</p>";
            }
          } catch (error) {
            editModalContent.innerHTML = `<p class="status-message error">Error: ${error.message}</p>`;
          }
        }
      }

      /*
    ================================================
    FUNGSI REUSABLE (Bisa dipakai Create & Update)
    ================================================
    */

      /**
       * Menyimpan data Store Product (untuk Create atau Update)
       * @param {HTMLElement} formRoot - Elemen yang berisi semua field form
       * @param {string|null} existingDocId - ID dokumen jika ini adalah 'Update'
       */
      async function saveStoreProduct(formRoot, existingDocId = null) {
        const productID =
          existingDocId ||
          formRoot.querySelector(".store-productID").value.trim();
        if (!productID) throw new Error("Product ID tidak boleh kosong!");

        const imageFile = formRoot.querySelector(".store-imageFile").files[0];

        // 1. Upload Gambar (HANYA jika file baru dipilih)
        let imageUrl = null;
        if (imageFile) {
          imageUrl = await uploadToCloudinary(imageFile);
        }

        // 2. Kumpulkan Price Bundles
        const priceBundles = [];
        formRoot.querySelectorAll(".price-bundle-item").forEach((item) => {
          priceBundles.push({
            name: item.querySelector(".bundle-name").value,
            price: Number(item.querySelector(".bundle-price").value),
            description: item.querySelector(".bundle-desc").value,
            order: Number(item.querySelector(".bundle-order").value),
          });
        });

        // 3. Kumpulkan FAQs
        const faqs = [];
        formRoot.querySelectorAll(".faq-item").forEach((item) => {
          faqs.push({
            question: item.querySelector(".faq-question").value,
            order: Number(item.querySelector(".faq-order").value),
          });
        });

        // 4. Siapkan data utama
        const productData = {
          name: formRoot.querySelector(".store-name").value,
          description: formRoot.querySelector(".store-description").value,
          notes: formRoot.querySelector(".store-notes").value,
          priceBundles: priceBundles,
        };

        // Tambahkan imageUrl HANYA jika ada gambar baru
        if (imageUrl) {
          productData.imageUrl = imageUrl;
        }

        // 5. Gunakan Batch Write
        const batch = db.batch();
        const productRef = db.collection("storeProducts").doc(productID);

        // 'set' dengan {merge: true} atau 'update'.
        // 'set' lebih aman jika dokumen mungkin belum ada.
        // Kita pakai 'update' jika 'existingDocId' ada, 'set' jika baru
        if (existingDocId) {
          batch.update(productRef, productData); // Hanya update, tidak menimpa
        } else {
          batch.set(productRef, productData); // Buat baru
        }

        // 6. Update/Setel sub-koleksi FAQ
        // Cara paling aman adalah hapus semua FAQ lama dan buat ulang
        const faqsCollectionRef = productRef.collection("faqs");
        const oldFaqsSnapshot = await faqsCollectionRef.get();
        oldFaqsSnapshot.forEach((doc) => batch.delete(doc.ref));

        // Tambahkan semua FAQ baru
        faqs.forEach((faq) => {
          const faqRef = faqsCollectionRef.doc(); // ID acak baru
          batch.set(faqRef, faq);
        });

        // 7. Jalankan batch
        await batch.commit();
      }

      /**
       * Memasang listener ke tombol '+' di dalam form dinamis
       * @param {HTMLElement} formElement - Elemen form (atau modal)
       */
      function addDynamicFormListeners(formElement) {
        formElement
          .querySelector(".add-price-bundle")
          .addEventListener("click", () => {
            const container = formElement.querySelector(
              ".price-bundles-container"
            );
            const item = createPriceBundleElement();
            container.appendChild(item);
          });

        formElement.querySelector(".add-faq").addEventListener("click", () => {
          const container = formElement.querySelector(".faqs-container");
          const item = createFaqElement();
          container.appendChild(item);
        });
      }

      /**
       * Membuat elemen HTML untuk 1 item Price Bundle
       * @param {object|null} data - Data untuk mengisi form (saat edit)
       */
      function createPriceBundleElement(data = null) {
        const item = document.createElement("div");
        item.className = "dynamic-item price-bundle-item";
        item.innerHTML = `
        <button type="button" class="remove-item-btn" onclick="this.parentElement.remove()">×</button>
        <div class="dynamic-item-grid">
          <div class="form-group">
            <label>Nama Bundle</label>
            <input type="text" class="bundle-name" placeholder="Misal: Private ACC" required value="${
              data?.name || ""
            }">
          </div>
          <div class="form-group">
            <label>Harga (Angka)</label>
            <input type="number" class="bundle-price" placeholder="15000" required value="${
              data?.price || ""
            }">
          </div>
          <div class="form-group col-full">
            <label>Deskripsi Bundle</label>
            <input type="text" class="bundle-desc" placeholder="Misal: / tahun" required value="${
              data?.description || ""
            }">
          </div>
          <div class="form-group">
            <label>Order (Angka)</label>
            <input type="number" class="bundle-order" placeholder="1" required value="${
              data?.order || ""
            }">
          </div>
        </div>
      `;
        return item;
      }

      /**
       * Membuat elemen HTML untuk 1 item FAQ
       * @param {object|null} data - Data untuk mengisi form (saat edit)
       */
      function createFaqElement(data = null) {
        const item = document.createElement("div");
        item.className = "dynamic-item faq-item";
        item.innerHTML = `
        <button type="button" class="remove-item-btn" onclick="this.parentElement.remove()">×</button>
        <div class="dynamic-item-grid">
          <div class="form-group col-full">
            <label>Pertanyaan</label>
            <input type="text" class="faq-question" placeholder="Misal: Aman gak min?" required value="${
              data?.question || ""
            }">
          </div>
          <div class="form-group">
            <label>Order (Angka)</label>
            <input type="number" class="faq-order" placeholder="1" required value="${
              data?.order || ""
            }">
          </div>
        </div>
      `;
        return item;
      }

      /*
    ================================================
    FUNGSI UTILITAS (Global)
    ================================================
    */

      /**
       * Fungsi untuk mengupload file ke Cloudinary (Reusable)
       */
      async function uploadToCloudinary(file) {
        if (!file) throw new Error("File gambar tidak ditemukan.");
        if (CLOUDINARY_CLOUD_NAME === "NAMA_CLOUD_ANDA") {
          throw new Error(
            "Harap masukkan Cloud Name Cloudinary Anda di dalam skrip."
          );
        }
        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
        const response = await fetch(
          `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
          { method: "POST", body: formData }
        );
        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(
            `Gagal upload ke Cloudinary: ${errorData.error.message}`
          );
        }
        const data = await response.json();
        return data.secure_url;
      }

      /**
       * Fungsi untuk menampilkan pesan status
       * @param {HTMLElement} element - Elemen status (e.g., modStatus)
       * @param {string} type - "success" atau "error"
       * @param {string} message - Pesan yang ditampilkan
       */
      function setStatus(element, type, message) {
        element.className = `status-message ${type}`;
        element.textContent = message;
      }

      /**
       * Mengatur status loading tombol
       * @param {HTMLElement} btn - Tombol submit
       * @param {HTMLElement} loader - Elemen loader
       * @param {boolean} isLoading - Status loading
       * @param {string} text - Teks tombol
       */
      function setLoading(btn, loader, isLoading, text) {
        if (btn) {
          btn.disabled = isLoading;
          btn.innerHTML = text;
        }
        if (loader) {
          loader.style.display = isLoading ? "block" : "none";
        }
      }
    </script>
  </body>
